services:
  backend:
    build: ./backend
    ports: 
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - ./backend:/app
  frontend:
    build: ./frontend
    ports: 
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
